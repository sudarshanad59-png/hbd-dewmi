<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Happy Birthday Dewmi!</title>
  <link rel="stylesheet" href="style.css" />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&family=Sacramento&display=swap" rel="stylesheet">
</head>
<body>
  <div class="stars"></div>
  <div class="twinkling"></div>

  <div class="card">
    <h1 class="title">Happy Birthday, Dewmi! 🎉</h1>
    <div class="cake-icon">🎂</div>
    
    <button id="wishBtn" onclick="revealWish()">Click For Your Wish ✨</button>
    
    <div id="wishText" class="wish-container hidden">
      <p class="message">
        Wishing you a day filled with happiness and a year filled with joy. 
        May all your dreams come true! Thank you for being such an amazing best friend. 🌸✨
      </p>
      <p class="signature">— Best Wishes from <span>Dinesh</span></p>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
